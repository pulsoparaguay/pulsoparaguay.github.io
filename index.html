k<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULSO GONZO | Terminal</title>
    <style>
        :root {
            --color-bg: #0a0a0a;
            --color-text: #eee;
            --color-accent: #ff4444;
            --color-cyber: #00f2ff;
            --font-main: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-main);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 800px;
            border-bottom: 2px solid var(--color-accent);
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--color-cyber);
            text-transform: uppercase;
            margin: 0;
        }

        #logs {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
        }

        .log-entry {
            border-left: 4px solid var(--color-accent);
            padding: 20px;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.03);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .timestamp {
            color: #666;
            font-size: 0.85rem;
            display: block;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .editorial-text {
            font-size: 1.1rem;
            text-align: left;
            color: #fff;
            white-space: pre-wrap; /* Para que respete los saltos de línea de la IA */
        }

        /* --- OPTIMIZACIÓN MOBILE --- */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            header {
                margin-bottom: 20px;
            }

            h1 {
                font-size: 1.2rem;
            }

            .log-entry {
                padding: 15px;
                border-left-width: 3px;
                margin-bottom: 25px;
            }

            .editorial-text {
                font-size: 1rem;
                line-height: 1.5;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>PULSO GONZO</h1>
        <div style="font-size: 0.7rem; color: #444;">LENOVO_G400S // LUQUE_PY // TERMINAL_ACTIVE</div>
    </header>

    <div id="logs">
        </div>

</body>
</html>
